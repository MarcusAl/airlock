name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Release tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: npm with staged publishing (11.15+)
        run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm --version
      - name: Stage the release (goes live only after the maintainer approves it on npm with 2FA)
        run: npm stage publish --access public --loglevel verbose
      - name: Keep npm's debug log if staging failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npm-logs
          path: ~/.npm/_logs/
